<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喵星球 - 猫咪百科 | 你的宠物指南</title>
    <style>
        /* 基础样式 */
        * { box-sizing: border-box; }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; margin: 0; background: #f8f9fa; color: #333; }
        
        /* 导航栏 */
        header { background: #fff; padding: 20px 10%; border-bottom: 2px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; color: #ff8c00; }
        nav a { margin-left: 20px; text-decoration: none; color: #666; font-size: 14px; }

        /* 内容区 */
        .hero { background: #ff8c00; color: #fff; padding: 60px 10%; text-align: center; }
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        
        /* 网格布局 */
        .cat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); transition: 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 200px; object-fit: cover; background: #eee; }
        .card-content { padding: 20px; }
        .card-content h3 { margin: 0 0 10px 0; color: #222; }
        .tag { display: inline-block; background: #fff3e0; color: #ff8c00; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-bottom: 10px; }
        
        footer { text-align: center; padding: 40px; color: #aaa; font-size: 12px; }
    </style>
</head>
<body>

<header>
    <div class="logo">喵星球 (MeowPlanet)</div>
    <nav>
        <a href="#">首页</a>
        <a href="#">品种百科</a>
        <a href="#">养宠技巧</a>
        <a href="#">关于我们</a>
    </nav>
</header>

<div class="hero">
    <h1>探索猫咪的奇妙世界</h1>
    <p>从品种起源到生活习性，这里有你想知道的一切</p>
</div>

<div class="container">
    <div class="cat-grid">
        <!-- 卡片 1 -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=500" alt="英国短毛猫">
            <div class="card-content">
                <span class="tag">稳重型</span>
                <h3>英国短毛猫</h3>
                <p>圆脸厚毛，性格稳重，非常有亲和力，是家庭养猫的首选。</p>
            </div>
        </div>
        <!-- 卡片 2 -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1573865526739-70659ad47326?auto=format&fit=crop&w=500" alt="布偶猫">
            <div class="card-content">
                <span class="tag">粘人型</span>
                <h3>布偶猫</h3>
                <p>被誉为“仙女猫”，以温顺和巨大的体型著称，非常粘人。</p>
            </div>
        </div>
        <!-- 卡片 3 -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1533738363-b7f9aef128ce?auto=format&fit=crop&w=500" alt="美短虎斑">
            <div class="card-content">
                <span class="tag">活泼型</span>
                <h3>美短虎斑猫</h3>
                <p>身体强壮，性格开朗活泼，极其聪明，是极佳的伴侣动物。</p>
            </div>
        </div>
    </div>
</div>

<footer>
    &copy; 2026 喵星球 · 致力于打造最专业的猫咪资料库
</footer>

</body>
</html>
